
name: terraform-modul7


on:
  workflow_dispatch:

  pull_request:
    branches: [main]
    paths:
      - "modul7/**"
      - ".github/workflows/terraform-modul7.yml"

  push:
    branches: [main]
    paths:
      - "modul7/**"
      - ".github/workflows/terraform-modul7.yml"


permissions:
  contents: read

jobs:
  build:
    name: Terraform Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: modul7

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.5"

      - name: Terraform Format
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init -backend=false -lockfile=readonly

      - name: Terraform Validate
        run: terraform validate

  plan:
    name: Terraform Plan
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment: dev

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: modul7

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.5"

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: terraform init -backend-config=backend.hcl -backend-config="key=modul7/dev/network.tfstate" -lockfile=readonly
        env:
          ARM_USE_AZUREAD: "true"
          ARM_USE_CLI: "true"

      - name: Terraform Plan
        run: terraform plan -var-file=dev.tfvars -input=false -no-color
        env:
          ARM_USE_CLI: "true"
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

          
  
  apply-dev:
    name: Terraform Apply Dev
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment: dev

    permissions:
      contents: read
      id-token: write
  
    defaults:
      run:
        working-directory: modul7

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.5"

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: terraform init -backend-config=backend.hcl -backend-config="key=modul7/dev/network.tfstate" -lockfile=readonly
        env:
          ARM_USE_AZUREAD: "true"
          ARM_USE_CLI: "true"

      - name: Terraform Apply Dev
        run: terraform apply -var-file=dev.tfvars -input=false -auto-approve
        env:
          ARM_USE_CLI: "true"
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
